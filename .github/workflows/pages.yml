name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build library
        run: npm run build

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          # Copy demo as index
          cp demo.html _site/index.html
          # Patch asset paths for GitHub Pages subdirectory
          sed -i 's|./dist/|./dist/|g' _site/index.html
          sed -i 's|./js/|./js/|g' _site/index.html
          # Copy assets
          cp -r dist _site/dist
          cp -r js   _site/js
          cp -r examples _site/examples 2>/dev/null || true

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - id: deployment
        uses: actions/deploy-pages@v4
